<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Whiteboard renderer</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #fbfaf7; }
  * { animation: none !important; transition: none !important; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; }
  #board { position: absolute; left: 0; top: 0; overflow: hidden; }
  #vignette { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; }
  #handwrap { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; display: none; }
  #handwrap svg { overflow: visible; display: block; }
  #capband {
    position: absolute; left: 0; top: 0; display: none; box-sizing: border-box;
    background: rgba(255, 255, 255, 0.93); border-radius: 18px;
    box-shadow: 0 6px 26px rgba(40, 32, 20, 0.08), 0 0 0 1px rgba(40, 32, 20, 0.05);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #captext {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    text-align: center; color: #2b2b2b; white-space: nowrap;
    font-feature-settings: "kern" 1, "liga" 1; -webkit-font-smoothing: antialiased;
  }
</style>
</head>
<body>
<div id="stage">
  <svg id="board" xmlns="http://www.w3.org/2000/svg"><defs id="defs"></defs><g id="cam"></g></svg>
  <div id="vignette"></div>
  <div id="handwrap"><svg id="handsvg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <g id="handContent"></g>
      <filter id="handShadow" x="-25%" y="-25%" width="160%" height="160%" color-interpolation-filters="sRGB">
        <feDropShadow id="handDrop" dx="9" dy="13" stdDeviation="3.5" flood-color="rgb(30,24,16)" flood-opacity="0.22"/>
      </filter>
    </defs>
    <g id="handLayer" filter="url(#handShadow)"></g>
  </svg></div>
  <div id="capband"><div id="captext"></div></div>
</div>
<script src="trace.js"></script>
<script src="engine.js"></script>
</body>
</html>
