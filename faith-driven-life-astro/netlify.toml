# Netlify build config for A Faith Driven Life (Astro)
# Deploy as a separate site so the current GitHub Pages site stays live until you switch.

[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Ensure /blog and /blog/ show the first page of posts (Astro pagination uses /blog/1/, /blog/2/, ...)
[[redirects]]
  from = "/blog"
  to = "/blog/1/"
  status = 302
[[redirects]]
  from = "/blog/"
  to = "/blog/1/"
  status = 302
