      <p class="blog-loading-msg" id="blog-status-msg" style="margin-top: 1.25rem;">

  <script>
    (function () {
      var BLOGGER_FEED_BASE = 'https://awfgsa.blogspot.com/feeds/posts/default?alt=json&max-results=25';
      var REQUEST_TIMEOUT_MS = 12000;
      var STATIC_FEED_TIMEOUT_MS = 10000;
      var REFRESH_MINUTES = 10;
      var listEl = document.getElementById('blog-list');
      var statusMsg = document.getElementById('blog-status-msg');
      var loadingDone = false;
      function setStatus(html) { if (statusMsg) statusMsg.innerHTML = html; }
      function getDateString(entry) {
        var raw = (entry.published && (entry.published.$t != null ? entry.published.$t : entry.published)) || (entry.updated && (entry.updated.$t != null ? entry.updated.$t : entry.updated));
        return typeof raw === 'string' ? raw : '';
      }
      function formatDate(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      }
      function stripHtml(html) {
        if (!html) return '';
        var div = document.createElement('div');
        div.innerHTML = html;
        return (div.textContent || div.innerText || '').trim().slice(0, 120);
      }
      function getPostUrl(entry) {
        var links = entry.link || [];
        for (var i = 0; i < links.length; i++) { if (links[i].rel === 'alternate') return links[i].href; }
        return 'https://awfgsa.blogspot.com/';
      }
      function getPostImage(entry) {
        var thumb = entry['media$thumbnail'];
        if (thumb && thumb.url) return thumb.url;
        if (thumb && thumb.length && thumb[0].url) return thumb[0].url;
        var content = (entry.content && entry.content.$t) || (entry.summary && entry.summary.$t) || '';
        var match = content.match(/<img[^>]+src=["']([^"']+)["']/i);
        return match ? match[1] : '';
      }
      function showError() {
        loadingDone = true;
        listEl.innerHTML = '<li class="blog-fallback">Could not load posts. <a href="https://awfgsa.blogspot.com/" target="_blank" rel="noopener noreferrer" style="color: var(--accent);">View them on the blog</a>. <button type="button" id="blog-retry-btn" style="margin-left:0.5rem;padding:0.25rem 0.6rem;background:var(--accent);color:var(--bg);border:none;border-radius:6px;cursor:pointer;font-weight:600;">Retry</button></li>';
        setStatus('Posts are loaded from <a href="https://awfgsa.blogspot.com/" target="_blank" rel="noopener noreferrer">the blog</a>.');
        var retryBtn = document.getElementById('blog-retry-btn');
        if (retryBtn) retryBtn.onclick = function () { loadingDone = false; listEl.innerHTML = '<li class="blog-skeleton"><a href="#"><span class="skeleton-img"></span><span class="blog-text"><span class="skeleton-title"></span><span class="skeleton-meta"></span></span></a></li>'; setStatus('Loading…'); load(); };
      }
      function renderPosts(data) {
        if (loadingDone) return;
        loadingDone = true;
        var entries = (data && data.feed && data.feed.entry) || [];
        if (entries.length === 0) { showError(); return; }
        listEl.innerHTML = '';
        entries.forEach(function (entry) {
          var title = (entry.title && entry.title.$t) || 'Untitled';
          var url = getPostUrl(entry);
          var imgUrl = getPostImage(entry);
          var date = formatDate(getDateString(entry));
          var snippet = stripHtml((entry.content && entry.content.$t) || (entry.summary && entry.summary.$t) || '');
          var meta = date + (snippet ? ' — ' + snippet + (snippet.length >= 120 ? '…' : '') : '');
          var imgHtml = imgUrl ? '<span class="blog-img-wrap"><img src="' + imgUrl.replace(/"/g, '&quot;') + '" alt="" class="blog-img" loading="lazy"></span>' : '';
          var li = document.createElement('li');
          li.innerHTML = '<a href="post.html?url=' + encodeURIComponent(url) + '">' + imgHtml + '<span class="blog-text"><span class="title">' + title.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</span><span class="meta">' + meta.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</span></span></a>';
          listEl.appendChild(li);
        });
        setStatus('Posts are loaded from <a href="https://awfgsa.blogspot.com/" target="_blank" rel="noopener noreferrer">the blog</a>.');
      }
      function fetchWithTimeout(url, isJson) {
        var ctrl = new AbortController();
        var t = setTimeout(function () { ctrl.abort(); }, REQUEST_TIMEOUT_MS);
        return fetch(url, { signal: ctrl.signal, cache: 'no-store', mode: 'cors' }).then(function (res) {
          clearTimeout(t);
          if (!res.ok) throw new Error();
          return isJson ? res.json() : res.text();
        }).catch(function () { clearTimeout(t); throw new Error(); });
      }
      function tryStaticFeed() {
        var base = (typeof location !== 'undefined' && location.origin) ? location.origin : '';
        var url = base + '/blog-feed.json?cb=' + (Math.floor(Date.now() / 60000));
        var ctrl = new AbortController();
        var t = setTimeout(function () { ctrl.abort(); }, STATIC_FEED_TIMEOUT_MS);
        return fetch(url, { signal: ctrl.signal, cache: 'no-store' }).then(function (res) {
          clearTimeout(t);
          if (!res.ok) throw new Error();
          return res.json();
        }).then(function (data) { renderPosts(data); return true; }).catch(function () { clearTimeout(t); return false; });
      }
      function tryApiRoute() {
        return fetchWithTimeout('/api/blog-feed', true).then(function (data) { renderPosts(data); return true; }).catch(function () { return false; });
      }
      function tryDirect() {
        var feedUrl = BLOGGER_FEED_BASE + '&_=' + Date.now();
        return fetchWithTimeout(feedUrl, true).then(function (data) { renderPosts(data); return true; }).catch(function () { return false; });
      }
      function tryProxy(proxyUrl) {
        var feedUrl = BLOGGER_FEED_BASE + '&_=' + Date.now();
        var url = proxyUrl.indexOf('?') !== -1 ? proxyUrl + encodeURIComponent(feedUrl) : proxyUrl + encodeURIComponent(feedUrl);
        return fetchWithTimeout(url, false).then(function (text) {
          var data; try { data = JSON.parse(text); } catch (e) { throw new Error(); }
          renderPosts(data);
          return true;
        }).catch(function () { return false; });
      }
      function tryAllOriginsGet() {
        var feedUrl = BLOGGER_FEED_BASE + '&_=' + Date.now();
        var url = 'https://api.allorigins.win/get?url=' + encodeURIComponent(feedUrl);
        return fetchWithTimeout(url, true).then(function (wrapper) {
          var raw = wrapper && wrapper.contents;
          if (!raw || typeof raw !== 'string') throw new Error();
          var d = JSON.parse(raw);
          renderPosts(d);
          return true;
        }).catch(function () { return false; });
      }
      function load() {
        tryStaticFeed().then(function (ok) {
          if (ok) return;
          var feedUrl = BLOGGER_FEED_BASE + '&_=' + Date.now();
          var proxies = [
            'https://corsproxy.io/?' + encodeURIComponent(feedUrl),
            'https://api.allorigins.win/raw?url=' + encodeURIComponent(feedUrl),
            'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(feedUrl)
          ];
          var apiRoute = tryApiRoute();
          var direct = tryDirect();
          var proxyPromises = proxies.map(function (url) { return fetchWithTimeout(url, false).then(function (text) { var d; try { d = JSON.parse(text); } catch (e) { throw new Error(); } renderPosts(d); return true; }).catch(function () { return false; }); });
          var allOriginsGet = tryAllOriginsGet();
          var all = [apiRoute, direct].concat(proxyPromises).concat([allOriginsGet]);
          var resolved = 0;
          function onDone(ok) {
            if (ok) return;
            resolved++;
            if (resolved === all.length && !loadingDone) showError();
          }
          all.forEach(function (p) { p.then(onDone).catch(function () { onDone(false); }); });
        });
      }
      load();
      setInterval(function () { if (!loadingDone) return; loadingDone = false; load(); }, REFRESH_MINUTES * 60 * 1000);
    })();
  </script>
