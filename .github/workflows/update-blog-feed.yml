# Update blog-feed.json from Blogger so the static site always has fresh posts.
# Runs on schedule and on push to main (so deploys get the latest feed).
name: Update blog feed
on:
  schedule:
    # Halved from every 6 hours on 2026-09-23. Four runs a day on a site nobody edits was
    # drawing ~120 runs a month out of the 2,000-minute Actions allowance this account shares
    # with pexflow-production — which is the repo that actually needs it. '*/12' fires at 00:00
    # and 12:00 UTC, so the feed is still refreshed twice daily and a push to main refreshes it
    # immediately regardless.
    - cron: '0 */12 * * *'  # Every 12 hours
  push:
    branches: [main]
    paths-ignore:
      # Do not list blog-feed.json here — otherwise pushes that only refresh the feed skip this workflow.
      - '**.md'
      - 'android-app/**'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch and write blog feed
        run: node scripts/update-blog-feed.js
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog-feed.json
          git diff --staged --quiet || (git commit -m "chore: update blog-feed.json from Blogger" && git push)
