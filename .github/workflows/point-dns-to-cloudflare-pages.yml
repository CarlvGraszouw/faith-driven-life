# Point www + apex DNS at Cloudflare Pages project hostname.
# Only removes A / AAAA / CNAME on those names that do NOT target *.pages.dev (preserves TXT, MX, etc.).
# Token needs Zone:DNS:Edit on zone afaithdrivenlife.com (in addition to Pages if separate).
name: Point DNS to Cloudflare Pages
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Point www and apex CNAME at Pages
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          CF_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n')
          ZONE_NAME="afaithdrivenlife.com"
          PAGES_TARGET="faith-driven-life.pages.dev"

          zone_resp=$(curl -sS -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}")
          ZONE_ID=$(echo "$zone_resp" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "null" ]; then
            echo "::error::No Cloudflare zone for ${ZONE_NAME}. Add the domain to this Cloudflare account first."
            echo "$zone_resp" | jq .
            exit 1
          fi
          echo "Zone ID: $ZONE_ID"

          all=$(curl -sS -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?per_page=500")

          echo "$all" | jq -c --arg z "$ZONE_NAME" \
            '.result[] | select(.name == ($z) or .name == ("www." + $z))' | while read -r row; do
            id=$(echo "$row" | jq -r '.id')
            typ=$(echo "$row" | jq -r '.type')
            name=$(echo "$row" | jq -r '.name')
            content=$(echo "$row" | jq -r '.content')
            case "$typ" in
              A|AAAA|CNAME)
                if echo "$content" | grep -q 'pages\.dev'; then
                  echo "Keeping $typ $name -> $content (already Pages)"
                else
                  echo "Deleting $typ $name -> $content"
                  curl -sS -X DELETE "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${id}" \
                    -H "Authorization: Bearer ${CF_TOKEN}" | jq '{success,errors}'
                fi
                ;;
              *)
                echo "Leaving $typ $name (not A/AAAA/CNAME)"
                ;;
            esac
          done

          echo "Upsert CNAME www -> ${PAGES_TARGET}"
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"CNAME\",\"name\":\"www\",\"content\":\"${PAGES_TARGET}\",\"proxied\":true,\"ttl\":1}" | jq '{success, result: .result | {type,name,content,proxied}, errors}'

          echo "Upsert CNAME apex -> ${PAGES_TARGET}"
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"CNAME\",\"name\":\"${ZONE_NAME}\",\"content\":\"${PAGES_TARGET}\",\"proxied\":true,\"ttl\":1}" | jq '{success, result: .result | {type,name,content,proxied}, errors}'
