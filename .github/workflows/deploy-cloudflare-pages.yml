# Deploy static site + Pages Functions to Cloudflare Pages (no Cloudflare Git build required).
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID — see SETUP.txt or README.md
#
# GitHub secrets often include a trailing newline when pasted; that breaks Wrangler
# ("Headers.set ... is an invalid header value"). We strip CR/LF before any Wrangler call.
name: Deploy Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sanitize Cloudflare secrets (strip newlines — fixes Wrangler header errors)
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          T=$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n')
          A=$(printf '%s' "$RAW_ACCOUNT" | tr -d '\r\n')
          echo "::add-mask::$T"
          echo "::add-mask::$A"
          {
            echo "CLOUDFLARE_API_TOKEN<<__EOF_TOKEN__"
            printf '%s' "$T"
            echo
            echo "__EOF_TOKEN__"
          } >> "$GITHUB_ENV"
          {
            echo "CLOUDFLARE_ACCOUNT_ID<<__EOF_ACC__"
            printf '%s' "$A"
            echo
            echo "__EOF_ACC__"
          } >> "$GITHUB_ENV"

      - name: Check Cloudflare secrets exist
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Add secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see SETUP.txt in repo root)."
            echo "Direct link: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

      - name: Verify Cloudflare token
        run: npx wrangler@4 whoami

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy . --project-name=faith-driven-life --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}"
